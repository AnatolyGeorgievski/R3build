# board/qcom/rb1.conf — QRB2210 RB1 (umbar: rb1-1)
# Рецепт Мити: do_image · legacy · pagesize 2048 · base 0x80000000
# Наша загрузка: Image.gz + dtb + ramdisk net_init stay

BOARD_ID=rb1-1
MODE=legacy
KERNEL_KIND=Image.gz
DTB_NAME=qcom/qrb2210-rb1.dtb
ABOOT_BASE=0x80000000
ABOOT_PAGESIZE=2048
CMDLINE="console=ttyMSM0,115200n8 clk_ignore_unused ignore_loglevel rdinit=/init root=/dev/ram0 stay rw"
