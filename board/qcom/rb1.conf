# board/qcom/rb1.conf — QRB2210 RB1 (umbar: rb1-1)
# Наша загрузка: Linux Image.gz + dtb + ramdisk net_init

BOARD_ID=rb1-1
MODE=legacy
KERNEL_KIND=Image.gz
DTB_NAME=qcom/qrb2210-rb1.dtb
ABOOT_BASE=0x80000000
ABOOT_PAGESIZE=4096
CMDLINE="console=ttyMSM0,115200n8 rdinit=/init root=/dev/ram0 stay rw"
# сохранены: board/qcom/rb1-1/qrb2210-rb1.{dts,dtb}
# DTB=board/qcom/rb1-1/qrb2210-rb1.dtb
# RAMDISK=out/ramdisk_net_init_a64.cpio.gz
# KERNEL= Linux Image.gz (не U-Boot)
